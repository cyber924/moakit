name: Pattern admin delete and layout checks
on:
  push:
    branches:
      - pattern-admin-delete-layout-20261112
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  pattern-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check admin JavaScript syntax
        run: |
          node --check public/pattern-admin.js
          node --check public/pattern-admin-visibility.mjs
      - name: Run focused deletion and existing pattern catalog tests
        run: node --test tests/pattern-admin-visibility.test.mjs tests/pattern-catalog.test.mjs
