name: Firebase admin health diagnostic
on:
  push:
    branches:
      - firebase-commerce-health-ui-20261112
      - admin-ops-status-lights-20261112
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check UI syntax and read-only health regression tests
        run: |
          node --check public/admin.js
          node --check public/firebase-commerce-health-admin.mjs
          node --check public/admin-operations-health.mjs
          node --check server/admin-system-health.mjs
          node --test tests/firebase-commerce-health-admin.test.mjs tests/admin-operations-health.test.mjs tests/vercel-routing.test.mjs
