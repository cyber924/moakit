name: Firebase commerce validation
on:
  push:
    branches:
      - firebase-commerce-hardening-20261112
      - firebase-diagnostic-transactions-20261112
      - simplify-commerce-no-stock-20261112
      - cleanup-work-commerce-safe-20261112
      - work-firebase-migration-steps-1-4-20261113
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate Cloud Functions and pure transaction helpers
        run: |
          node --check functions/index.cjs
          node --check public/kits.js
          node --check public/kit-admin.js
          node --check public/kit-core.mjs
          node --check public/commerce.js
          node --check public/commerce-switch.mjs
          node --check public/kit-orders.js
          node --check public/kits-client.js
          node --check server/commerce-routing.mjs
          node --check functions/commerce-core.cjs
          node --check functions/commerce-diagnostics.cjs
          node --check public/firebase-commerce-diagnostics-admin.mjs
          node --check tests/firebase-emulator-commerce.cjs
          node --test tests/firebase-functions-commerce.test.mjs tests/firebase-commerce-hardening.test.mjs tests/firebase-commerce-cutover.test.mjs tests/firebase-admin-diagnostics.test.mjs tests/firebase-simple-commerce.test.mjs tests/work-commerce-cleanup.test.mjs tests/vercel-routing.test.mjs
      - name: Install backend dependencies and verify entry point
        run: |
          npm --prefix functions install --ignore-scripts --no-audit --no-fund
          node -e "require('./functions/index.cjs'); console.log('Cloud Functions entry point OK')"

  firebase-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Firebase emulator dependencies
        run: |
          npm --prefix functions install --ignore-scripts --no-audit --no-fund
          npm install -g firebase-tools --no-audit --no-fund
          java -version
      - name: Test Firebase transaction and PDF flow in disposable emulators
        env:
          CI: 'true'
          GOOGLE_CLOUD_PROJECT: studio-1613487721-b043c
        run: |
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then
            export JAVA_HOME="$JAVA_HOME_21_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          firebase emulators:exec --non-interactive --project studio-1613487721-b043c --only auth,firestore,storage,functions "node tests/firebase-emulator-commerce.cjs"
